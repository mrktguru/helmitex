# portal.helmitex.ru — генератор этикеток. Живёт в /portal_helmitex на helmitex-tbcloud (200.165.239.159).
# Снаружи доступен только через общий роутер /edge (80/443 по имени домена);
# свои порты слушает на 127.0.0.1:7080/7443. Ни сети, ни БД, ни сертификатов с соседями не делит.
name: portal_helmitex

x-backend: &backend
  build: ./app/backend
  image: portal_helmitex-backend
  restart: unless-stopped
  env_file: .env
  depends_on: [postgres, redis, minio]
  networks: [internal]

services:
  postgres:
    image: postgres:16-alpine
    container_name: portal_helmitex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7-alpine
    container_name: portal_helmitex-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./data/redis:/data
    networks: [internal]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: portal_helmitex-minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./data/minio:/data
    networks: [internal]

  api:
    <<: *backend
    container_name: portal_helmitex-api
    command: ["node", "dist/index.js"]

  worker:
    <<: *backend
    container_name: portal_helmitex-worker
    command: ["node", "dist/workers/pdfGenerator.js"]

  nginx:
    image: nginx:1.27-alpine
    container_name: portal_helmitex-nginx
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "127.0.0.1:7080:80"
      - "127.0.0.1:7443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/frontend/dist:/usr/share/nginx/html:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    networks: [internal]

networks:
  internal:
    name: portal_helmitex_internal
