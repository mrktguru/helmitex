# portal.helmitex.ru. Перед ним стоит /edge: TLS приходит сюда нерасшифрованным (SNI passthrough),
# HTTP :80 — проксированным с исходным Host. helmitex.ru и www — редирект на портал.
server {
    listen 80;
    server_name portal.helmitex.ru helmitex.ru www.helmitex.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://portal.helmitex.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name helmitex.ru www.helmitex.ru;
    ssl_certificate     /etc/letsencrypt/live/portal.helmitex.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.helmitex.ru/privkey.pem;
    return 301 https://portal.helmitex.ru$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name portal.helmitex.ru;

    ssl_certificate     /etc/letsencrypt/live/portal.helmitex.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.helmitex.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 50M;

    # резолв через docker DNS на каждый запрос: nginx стартует, даже если api лежит
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://portal_helmitex-api:3100;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html всегда сверяется с сервером: после выкладки браузер сразу берёт новую сборку
        add_header Cache-Control "no-cache";
    }
}
